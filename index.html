<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Restoring BeatGuess v8</title><style>body{font-family:system-ui;background:#0f1020;color:#f4f5ff;padding:20px}</style></head><body><p id="restoreStatus">Loading the earlier Deezer-only BeatGuess version…</p><script>(async function(){try{const root='https://raw.githubusercontent.com/pacorob/beatguess/34d89b81470e397d330805b2eb007cdde10b46b2/';const responses=await Promise.all([fetch(root+'index.html',{cache:'no-store'}),fetch(root+'app.js',{cache:'no-store'})]);if(responses.some(r=>!r.ok))throw new Error('Could not retrieve the archived files');const [html,js]=await Promise.all(responses.map(r=>r.text()));if(!html.toLowerCase().startsWith('<!doctype html>')||!js.startsWith('const decades='))throw new Error('Unexpected archive contents');const archived=new DOMParser().parseFromString(html,'text/html');archived.querySelectorAll('script').forEach(s=>s.remove());document.open();document.write('<!doctype html>'+archived.documentElement.outerHTML);document.close();const script=document.createElement('script');script.textContent=js;document.body.appendChild(script);const note=document.createElement('p');note.className='note';note.textContent='Restored version: Deezer-only v8 (34d89b8), before the verified catalogue. Earlier filtering limitations apply.';document.querySelector('.app').prepend(note)}catch(e){const message=document.createElement('p');message.textContent='The earlier BeatGuess version could not load: '+e.message;document.body.appendChild(message)}})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BeatGuess — cover exclusions v8.1</title><style>body{font-family:system-ui;background:#0f1020;color:#f4f5ff;padding:20px}</style></head><body><p>Loading Deezer-only BeatGuess with cover exclusions v8.1…</p><script>(async function(){try{const root='https://raw.githubusercontent.com/pacorob/beatguess/34d89b81470e397d330805b2eb007cdde10b46b2/';const responses=await Promise.all([fetch(root+'index.html',{cache:'no-store'}),fetch(root+'app.js',{cache:'no-store'})]);if(responses.some(r=>!r.ok))throw new Error('Could not retrieve game files');const [html,original]=await Promise.all(responses.map(r=>r.text()));if(!html.toLowerCase().startsWith('<!doctype html>')||!original.startsWith('const decades='))throw new Error('Unexpected game contents');if(!original.includes('function isBad(r)')||!original.includes('function deezerSong(r)')||!original.includes('function pool()'))throw new Error('Missing filter hooks');let js=original.replace('function isBad(r)','function legacyIsBad(r)').replace('function deezerSong(r)','function legacyDeezerSong(r)').replace('function pool()','function legacyPool()');const patch=String.raw`

function isBad(r){

 const padded=' '+text+' ';
 const blocked=['the gem singers','2000s pop tour','musikverein ayl','the cat and owl','the lullabeets','diamond string orchestra'];
 if(blocked.some(name=>padded.includes(' '+name+' ')))return true;
 if(/\b(kids|kidz|children|childrens|nursery|lullaby|lullabies|lullabeets|toddler|toddlers|kinder|kinderen|kindermuziek|kinderlied|kinderliedjes|kinderkoor|kinderlieder|kinderchor|kinderdisco|sing along|singalong|cocomelon|piano|pianoforte|pianist|orchestra|orchestral|orchester|orkest|symphony|symphonic|philharmonic|string quartet|string orchestra|brass band|marching band|concert band|musikverein|rendition|renditions)\b/.test(text))return true;
 return legacyIsBad({title:text,artist:{name:''}});
}
function deezerSong(r){return {...legacyDeezerSong(r),albumTitle:coverAlbum(r),title_version:r.title_version||'',contributors:(r.contributors||[]).map(a=>({name:a.name||''})),exclusionVersion:'8.1'}}
function pool(){return legacyPool().filter(s=>!isBad(s))}
`;js+='\n'+patch;const archived=new DOMParser().parseFromString(html,'text/html');archived.querySelectorAll('script').forEach(s=>s.remove());archived.title='BeatGuess — cover exclusions v8.1';document.open();document.write('<!doctype html>'+archived.documentElement.outerHTML);document.close();const script=document.createElement('script');script.textContent=js;document.body.appendChild(script);const note=document.createElement('p');note.className='note';note.textContent='Cover exclusions v8.1 — restored Deezer search, no fixed song catalogue. Named cover sources, kids’, orchestra and piano indicators are checked in track, artist and album metadata. Saved packs and scores are preserved. Filtering remains best-effort.';document.querySelector('.app').prepend(note);const help=document.getElementById('help');if(help){const p=document.createElement('p');p.textContent='Excluded sources: The Gem Singers; 2000s Pop Tour; Musikverein Ayl; The Cat and Owl; The Lullabeets; Diamond String Orchestra. Checks include album titles, artists and contributors. Existing excluded tracks remain stored but cannot be selected for gameplay.';help.appendChild(p)}}catch(e){const message=document.createElement('p');message.textContent='BeatGuess could not load: '+e.message;document.body.appendChild(message)}})();</script></body></html>

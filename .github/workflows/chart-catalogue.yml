name: Import historical chart catalogue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/chart-catalogue.yml'
  schedule:
    - cron: '15 8 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: chart-catalogue
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.12.3
      - name: Build primary Billboard history
        run: python scripts/build_chart_catalogue.py
      - name: Backfill additional chart sources
        env:
          CHART_BATCH: '40'
        run: python scripts/import_additional_charts.py
      - name: Commit generated chart history and progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/chart-songs.json data/chart-source-cache.json.gz data/chart-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh multi-source chart catalogue and backfill progress'
            git push
          fi
      - name: Prepare site
        run: |
          mkdir -p _site/data
          cp index.html app.js chart-filter.js _site/
          cp data/chart-songs.json data/chart-import-report.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: import
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalogue and site
        id: deployment
        uses: actions/deploy-pages@v4
